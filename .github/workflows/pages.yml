name: Publicar Portal Investidor10
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar site e acervo
        run: |
          rm -rf _site _legacy
          mkdir -p _site/documentos/{carteiras,acoes,fiis,renda-fixa,editorial}
          cp index.html _site/index.html
          python3 scripts/patch_editorial.py

          # Recupera o acervo que já havia sido separado para o Investidor10.
          if [ -f GM_RESEARCH_INVESTIDOR10_PORTAL.zip ]; then
            unzip -q GM_RESEARCH_INVESTIDOR10_PORTAL.zip -d _legacy
            BASE="_legacy/GM_RESEARCH_INVESTIDOR10_PORTAL"
            # Carteiras anteriores: setembro + histórico. Outubro vem sempre da pasta editável atual.
            if [ -d "$BASE/01_CARTEIRAS/SETEMBRO_2026" ]; then cp -a "$BASE/01_CARTEIRAS/SETEMBRO_2026/." _site/documentos/carteiras/; fi
            if [ -d "$BASE/01_CARTEIRAS/HISTORICO" ]; then cp -a "$BASE/01_CARTEIRAS/HISTORICO/." _site/documentos/carteiras/; fi
            if [ -d "$BASE/02_ANALISES_ACOES" ]; then cp -a "$BASE/02_ANALISES_ACOES/." _site/documentos/acoes/; fi
            if [ -d "$BASE/03_ANALISES_FIIS" ]; then cp -a "$BASE/03_ANALISES_FIIS/." _site/documentos/fiis/; fi
          fi

          # Arquivos enviados manualmente no GitHub têm prioridade sobre o acervo legado.
          if [ -d documentos/carteiras ]; then find documentos/carteiras -maxdepth 1 -type f -iname '*.pdf' -exec cp -f {} _site/documentos/carteiras/ \;; fi
          if [ -d documentos/acoes ]; then find documentos/acoes -maxdepth 1 -type f -iname '*.pdf' -exec cp -f {} _site/documentos/acoes/ \;; fi
          if [ -d documentos/fiis ]; then find documentos/fiis -maxdepth 1 -type f -iname '*.pdf' -exec cp -f {} _site/documentos/fiis/ \;; fi

          if [ -d documentos/renda-fixa ]; then find documentos/renda-fixa -maxdepth 1 -type f -iname '*.pdf' -exec cp -f {} _site/documentos/renda-fixa/ \;; fi

          if [ -d documentos/editorial ]; then find documentos/editorial -maxdepth 1 -type f -iname '*.pdf' -exec cp -f {} _site/documentos/editorial/ \;; fi

          # ZIPs enviados a lotes/ entram na mesma publicacao, sem mudar o acervo legado.
          python3 scripts/importar_lotes.py

          python3 - <<'PY'
          import os,json
          out=[]
          LABELS={
            # Ações
            'DIRR3':'Direcional (DIRR3)','PETR4':'Petrobras (PETR4)','BBAS3':'Banco do Brasil (BBAS3)',
            'PRIO3':'PRIO (PRIO3)','CPLE3':'Copel (CPLE3)','NKE':'Nike (NKE)',
            # FIIs
            'PVBI11':'PVBI11','GARE11':'GARE11','HGRU11':'HGRU11','VISC11':'VISC11',
            'XPML11':'XPML11','XPLG11':'XPLG11','BTLG11':'BTLG11','HGLG11':'HGLG11','TRXF11':'TRXF11'
          }
          def reference_month(filename):
              import re
              months={'janeiro':1,'fevereiro':2,'marco':3,'março':3,'abril':4,'maio':5,'junho':6,'julho':7,'agosto':8,'setembro':9,'outubro':10,'novembro':11,'dezembro':12}
              n=filename.lower()
              for word,num in months.items():
                  m=re.search(word+r'[_\\s-]*(20\\d{2})',n)
                  if m: return f'{m.group(1)}-{num:02d}'
              m=re.search(r'(?:^|[_\\s-])(?:jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)(20\\d{2})',n)
              if m: return f'{m.group(1)}-{["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"].index(n[m.start()+1:m.start()+4])+1:02d}'
              return None
          def display_name(filename,cat):
              stem=os.path.splitext(filename)[0]
              if cat in ('acoes','fiis'):
                  up=stem.upper()
                  for ticker,label in LABELS.items():
                      if ticker in up:
                          rest=stem.replace('_',' ').replace('-',' ')
                          # Mantém a descrição original, mas garante o ativo na frente.
                          return f'{label} · {rest}'
              return stem
          for cat in ('carteiras','acoes','fiis','renda-fixa','editorial'):
              root=f'_site/documentos/{cat}'
              for f in os.listdir(root):
                  if f.lower().endswith('.pdf'):
                      out.append({'category':cat,'name':f,'display_name':display_name(f,cat),'path':f'documentos/{cat}/{f}', 'reference_month':reference_month(f), 'published_at': '2026-11-11' if f.endswith('_REV3.pdf') or f.startswith(('GM_Research_Dossie_EXXO34_XOM_3T26','GM_Research_Dossie_Ibovespa_Novembro','GM_Research_Dossie_SP500_Novembro','GM_Research_Dossie_EWZ_Novembro','GM_Research_Dossie_Retornos_de_Longo_Prazo')) else None})
          out.sort(key=lambda x:(x['category'],x['name'].lower()))
          with open('_site/manifest.json','w',encoding='utf8') as h:
              json.dump(out,h,ensure_ascii=False,indent=2)
          print('Documentos publicados:',len(out))
          PY
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
