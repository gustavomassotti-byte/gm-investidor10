name: Publicar Portal Investidor10
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar site e índice automático
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          if [ -d documentos ]; then cp -a documentos _site/documentos; fi
          python3 - <<'PY'
          import os,json
          out=[]
          roots=[('carteiras','documentos/carteiras'),('acoes','documentos/acoes'),('fiis','documentos/fiis')]
          for cat,root in roots:
              if not os.path.isdir(root): continue
              for base,dirs,files in os.walk(root):
                  for f in files:
                      if f.lower().endswith('.pdf'):
                          p=os.path.join(base,f).replace('\\','/')
                          out.append({'category':cat,'name':f,'path':p})
          out.sort(key=lambda x:(x['category'],x['name'].lower()))
          with open('_site/manifest.json','w',encoding='utf8') as h: json.dump(out,h,ensure_ascii=False,indent=2)
          PY
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
